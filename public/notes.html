<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes — 00_T3st_env</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --card: #1e293b;
        --accent: #6366f1;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1e293b, var(--bg));
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 3rem 1rem;
      }
      main { width: 100%; max-width: 560px; }
      h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
      p.sub { margin: 0 0 1.5rem; color: var(--muted); }
      form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
      input[type="text"] {
        flex: 1;
        padding: 0.75rem 1rem;
        border-radius: 0.6rem;
        border: 1px solid #334155;
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
      }
      button {
        padding: 0.75rem 1.1rem;
        border: none;
        border-radius: 0.6rem;
        background: var(--accent);
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.6rem; }
      li {
        background: var(--card);
        border: 1px solid #334155;
        border-radius: 0.6rem;
        padding: 0.85rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      li time { color: var(--muted); font-size: 0.75rem; display: block; margin-top: 0.2rem; }
      li .text { overflow-wrap: anywhere; }
      li button {
        background: transparent;
        color: var(--muted);
        border: 1px solid #334155;
        padding: 0.35rem 0.6rem;
        font-size: 0.8rem;
      }
      .empty { color: var(--muted); text-align: center; padding: 1.5rem 0; }
      a { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <p class="sub">Sandbox demo kept beside <a href="/">Du bist was du isst</a>.</p>
      <form id="note-form">
        <input id="note-input" type="text" placeholder="Write a note…" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <ul id="note-list"></ul>
    </main>
    <script>
      const list = document.getElementById("note-list");
      const form = document.getElementById("note-form");
      const input = document.getElementById("note-input");

      async function loadNotes() {
        const res = await fetch("/api/notes");
        const notes = await res.json();
        render(notes);
      }

      function render(notes) {
        if (!notes.length) {
          list.replaceChildren();
          const empty = document.createElement("li");
          empty.className = "empty";
          empty.textContent = "No notes yet. Add one above.";
          list.append(empty);
          return;
        }
        list.replaceChildren();
        for (const note of notes) {
          const li = document.createElement("li");
          const wrap = document.createElement("div");
          const text = document.createElement("div");
          text.className = "text";
          text.textContent = note.text;
          const time = document.createElement("time");
          time.textContent = new Date(note.createdAt).toLocaleString();
          wrap.append(text, time);
          const del = document.createElement("button");
          del.textContent = "Delete";
          del.onclick = async () => {
            await fetch(`/api/notes/${note.id}`, { method: "DELETE" });
            loadNotes();
          };
          li.append(wrap, del);
          list.append(li);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        await fetch("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        input.value = "";
        loadNotes();
      });

      loadNotes();
    </script>
  </body>
</html>
