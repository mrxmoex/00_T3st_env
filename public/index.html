<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes — 00_T3st_env</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <p class="sub">Saved to disk, so your notes survive a server restart.</p>

      <form id="note-form">
        <input
          id="note-input"
          type="text"
          placeholder="Write a note…"
          autocomplete="off"
          maxlength="10000"
          required
        />
        <button id="add-button" type="submit">Add</button>
      </form>

      <input id="search-input" type="search" placeholder="Search notes…" autocomplete="off" />

      <div id="error" class="error" role="alert" hidden>
        <span id="error-text"></span>
        <button id="error-dismiss" type="button" aria-label="Dismiss error">✕</button>
      </div>

      <ul id="note-list" aria-busy="false"></ul>
      <p id="status" class="status"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
